<body>
<div id="viewport"><main id="screen">
  <section id="title" class="parchment iron-frame rivet"><div class="small">ŘEMESLO STŘEDOVĚKU</div><div class="title-main" id="titleMain"></div><div class="title-sub" id="titleSub"></div></section>
  <section id="phases" class="wood iron-frame rivet"></section>

  <aside id="observe" class="parchment iron-frame rivet"><div class="panel-title">Co právě pozoruji</div><div id="workpiece-card" class="parchment"><div class="workpiece-name" id="workpiece"></div><div class="workpiece-stage" id="workstage"></div><div class="mini-silhouette"></div></div><div id="observations"></div><div id="station-note" class="parchment"></div></aside>

<script>
const phaseNames=['Materiál','Výheň','Kovadlina','Kalení','Broušení','Sestavení','Zkouška'];
const stations=[
 {id:'forge',key:'1',ico:'♨',name:'Výheň',sub:'Čtení žáru',phase:1,work:'Polotovar sekery',stage:'místní ohřev ostří',instruction:'Zahřej pracovní část rovnoměrně a včas ji vytáhni.',tool:'Kleště • měchy',senses:['barva','jiskry','zvuk'],obs:[['Barva','jasně oranžová','good'],['Ohřev','levá část chladnější','warn'],['Okuje','lehké','good'],['Jiskření','zatím žádné','good']],note:'Teplota zůstává skrytá. Rozhoduje barva kovu, okuje, jiskření a zvuk výhně.',quote:'Nežeň měchy bez rozmyslu. Ostří už pracuje, ale u oka je železo ještě tmavé.',controls:[['A / D','posunout'],['Q / E','otočit'],['Mezerník','měchy'],['Enter','vytáhnout']],scene:'forge'},
 {id:'anvil',key:'2',ico:'⚒',name:'Kovadlina',sub:'Tvarování údery',phase:2,work:'Polotovar sekery',stage:'vytahování ostří',instruction:'Rozšiř ostří k cílovému obrysu a udrž osu výrobku.',tool:'Plochá strana kladiva',senses:['tvar','žár','zvuk'],obs:[['Žár','vhodný k práci','good'],['Osa','nepatrně utíká doprava','warn'],['Tloušťka','střed je příliš silný','warn'],['Povrch','bez prasklin','good']],note:'Cílový obrys je učňovská pomůcka. S praxí zeslábne a později zmizí.',quote:'Dobrá rána má směr. Teď ji vedeš doprava — výrobek obracej dřív, než ti uteče osa.',controls:[['Myš','místo úderu'],['LMB podržet','síla'],['RMB','obrátit'],['Kolečko','změnit nástroj']],scene:'anvil'},
 {id:'quench',key:'3',ico:'≋',name:'Kalicí káď',sub:'Kalení ostří',phase:3,work:'Sekera',stage:'kalení pracovní hrany',instruction:'Ponoř pouze ostří, drž sklon a nereaguj zbrkle na páru.',tool:'Kleště • voda',senses:['pára','chvění','zvuk'],obs:[['Poloha','lehce nakloněná','warn'],['Hloubka','kalí se jen ostří','good'],['Pára','silná a souvislá','good'],['Chvění','mírné','good']],note:'Čas neodpočítává číslo. Hráč čte páru, syčení a odpor v kleštích.',quote:'Klidně. Neviklej s tím. Když ponoříš i oko, uděláš křehkým, co má zůstat houževnaté.',controls:[['Myš svisle','ponořit'],['Myš do stran','náklon'],['LMB','držet kleště'],['Enter','vyjmout']],scene:'quench'},

let current=0;
function sceneHTML(id){
 const common={forge:'<div class="coal-bed"></div><div class="bellows"></div><div class="air"></div><div class="hotbar"></div><div class="heat-zones"><div class="heat-zone">chladnější</div><div class="heat-zone hot">pracovní žár</div><div class="heat-zone">klesající žár</div></div>',anvil:'<div class="anvil"></div><div class="target-outline"></div><div class="workpiece"></div><div class="strike"></div><div class="hammer"></div>',quench:'<div class="tub"></div><div class="water"></div><div class="steam"></div><div class="angle-guide"></div><div class="quench-piece"></div>',grind:'<div class="wheel"></div><div class="blade"></div><div class="sparks"></div>',bench:'<div class="bench"></div><div class="handle"></div><div class="axe-head"></div><div class="fit-ring"></div>',test:'<div class="test-log"></div><div class="test-axe"></div><div class="impact"></div>'}; return common[id];
}
function render(i){current=i;const s=stations[i];document.body.dataset.station=s.id;
 document.getElementById('titleMain').textContent=s.name;document.getElementById('titleSub').textContent=s.sub;
 document.getElementById('phases').innerHTML=phaseNames.map((p,n)=>`<div class="phase ${n<s.phase?'done':n===s.phase?'active':''}"><span class="dot"></span>${p}</div>`).join('');
 document.getElementById('instruction').textContent=s.instruction;document.getElementById('toolHint').textContent=s.tool;
 document.getElementById('sense-strip').innerHTML=s.senses.map(x=>`<span class="sense on">${x}</span>`).join('');
 document.getElementById('workpiece').textContent=s.work;document.getElementById('workstage').textContent=s.stage;
 document.getElementById('observations').innerHTML=s.obs.map(o=>`<div class="obs ${o[2]}"><span class="mark"></span><div class="label">${o[0]}</div><div class="value">${o[1]}</div></div>`).join('');
 document.getElementById('station-note').textContent=s.note;document.getElementById('mentorQuote').textContent='„'+s.quote+'“';
 document.getElementById('controls').innerHTML=s.controls.map(c=>`<div class="control"><span class="key">${c[0]}</span>${c[1]}</div>`).join('')+'<div class="control exit"><span class="key">Esc</span>odejít od pracoviště</div>';
 document.getElementById('scene').innerHTML=sceneHTML(s.scene);
 document.getElementById('station-tabs').innerHTML=stations.map((x,n)=>`<button class="station-tab ${n===i?'active':''}" data-i="${n}"><span class="num">${x.key}</span><span class="ico">${x.ico}</span>${x.name}</button>`).join('');
 document.querySelectorAll('.station-tab').forEach(b=>b.onclick=()=>render(+b.dataset.i));
}
function fit(){const scale=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('screen').style.transform=`scale(${scale})`}
addEventListener('resize',fit);addEventListener('keydown',e=>{const n=+e.key;if(n>=1&&n<=6)render(n-1)});fit();render(0);
</script>
